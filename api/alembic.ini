# Alembic configuration for the CHAT database (PostgreSQL).
#
# Run from the repository root:
#   alembic -c api/alembic.ini upgrade head
# or from inside api/ (this is what the Docker image does):
#   alembic upgrade head
#
# The database URL is NOT stored here: env.py takes CHAT_DATABASE_URL from
# settings (.env / environment variables), so no password lives in git.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
